name: Repository Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck perl python3-yaml

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: Validate Bash syntax
        run: |
          bash -n scripts/kvm_diagnostic.sh
          bash -n scripts/ubuntu_health.sh
          bash -n scripts/vm_snapshot.sh
          bash -n scripts/enterprise_support_bundle.sh

      - name: Run ShellCheck
        run: |
          shellcheck scripts/kvm_diagnostic.sh
          shellcheck scripts/ubuntu_health.sh
          shellcheck scripts/vm_snapshot.sh
          shellcheck scripts/enterprise_support_bundle.sh

      - name: Validate cloud-init YAML syntax
        run: |
          python3 -c "from pathlib import Path; import yaml; files=sorted(Path("infra/cloud-init").glob("*.yaml.tftpl")); assert files, "No cloud-init templates found"; [yaml.safe_load(f.read_text()) for f in files]; print(f"Validated {len(files)} cloud-init templates")"

      - name: Check OpenTofu formatting
        run: |
          tofu fmt -check -recursive infra/tofu

      - name: Initialize OpenTofu providers
        run: |
          tofu -chdir=infra/tofu init -backend=false -input=false

      - name: Validate OpenTofu configuration
        run: |
          tofu -chdir=infra/tofu validate -no-color

      - name: Validate Phase 4 DB bootstrap
        run: |
          bash -n infra/bootstrap/phase4-db-bootstrap.sh
          shellcheck infra/bootstrap/phase4-db-bootstrap.sh

      - name: Validate Python
        run: |
          python3 -m py_compile scripts/kvm_monitor.py
          python3 -m py_compile infra/app/app.py

      - name: Validate Perl
        run: |
          perl -c scripts/log_parser.pl

      - name: Validate repository whitespace
        run: |
          git diff --check
